<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fact Knowledge Layer</title>
  <meta name="description"
        content="Claims extracted from PDFs, grounded in source evidence and compared across documents.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='4' fill='%230a0a0c'/%3E%3Crect x='2' y='2' width='36' height='36' rx='3' fill='none' stroke='%23f5a623' stroke-width='1.5'/%3E%3Ctext x='20' y='27' font-family='JetBrains Mono,monospace' font-size='16' font-weight='700' fill='%23f5a623' text-anchor='middle' letter-spacing='0.5'%3EFK%3C/text%3E%3C/svg%3E">

  <!-- Fonts + Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

  <!-- Tailwind Play CDN. Design tokens for the calm dark workspace theme. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Surfaces: a short, even ramp from the app background up to a
            // raised card. Fewer steps than before, so panels read as one plane.
            background: '#0b0c0f',
            surface: '#101216',
            'surface-dim': '#0e1013',
            'surface-bright': '#242a33',
            'surface-container-lowest': '#0e1013',
            'surface-container-low': '#14171c',
            'surface-container': '#171b21',
            'surface-container-high': '#1d222a',
            'surface-container-highest': '#242a33',
            'surface-variant': '#242a33',

            // Text: one bright, one muted, one faint. That is the whole ladder.
            'on-surface': '#e7eaf0',
            'on-surface-variant': '#98a1b0',
            'on-background': '#e7eaf0',
            outline: '#767f8d',
            'outline-variant': '#333a45',
            line: '#222831',
            'line-strong': '#2b323c',

            // Amber accent, used sparingly: the active nav item, the primary
            // button, and the evidence highlight.
            primary: '#ffd48a',
            'on-primary': '#2a1c00',
            'primary-container': '#f0b429',
            'on-primary-container': '#1a1204',
            'primary-fixed': '#ffe3b5',
            'primary-fixed-dim': '#ffc55c',
            'on-primary-fixed': '#241700',
            'on-primary-fixed-variant': '#5c3d00',

            secondary: '#9dc4ff',
            'on-secondary': '#00305a',
            'secondary-container': '#60a5fa',
            'on-secondary-container': '#08243f',
            'secondary-fixed': '#d3e4ff',
            'secondary-fixed-dim': '#a2c9ff',

            tertiary: '#4ade80',
            'on-tertiary': '#00391c',
            'tertiary-container': '#4ade80',
            'on-tertiary-container': '#06301a',
            'tertiary-fixed': '#86efac',
            'tertiary-fixed-dim': '#4ade80',

            error: '#f87171',
            'on-error': '#450a0a',
            'error-container': '#7f1d1d',
            'on-error-container': '#fecaca',

            // Verdict palette — the one place colour carries meaning.
            'v-corr':   '#4ade80',
            'v-contra': '#f87171',
            'v-recon':  '#fbbf24',
            'v-super':  '#60a5fa',
            'v-partial':'#94a3b8',
            'v-under':  '#a78bfa',
          },
          borderRadius: {
            DEFAULT: '0.5rem',
            sm: '0.375rem',
            md: '0.5rem',
            lg: '0.75rem',
            xl: '1rem',
            full: '9999px',
          },
          spacing: {
            'space-2xs': '2px',
            'space-xs': '4px',
            'space-sm': '8px',
            'space-md': '12px',
            'space-base': '16px',
            'space-lg': '24px',
            'space-xl': '40px',
            'space-1': '4px',
            'space-2': '8px',
            'space-3': '12px',
            'space-4': '16px',
            'space-5': '20px',
            'space-6': '24px',
            'space-8': '32px',
            'sidebar-width': '236px',
            'inspector-width': '380px',
            'gutter-default': '16px',
          },
          fontFamily: {
            // Inter carries the interface. Mono is reserved for numbers,
            // identifiers and quoted source text.
            'label-md': ['Inter'],
            'label-sm': ['Inter'],
            'label-lg': ['Inter'],
            'body-sm': ['Inter'],
            'body-md': ['Inter'],
            'body-lg': ['Inter'],
            'headline-md': ['Inter'],
            'headline-lg': ['Inter'],
            'headline-xl': ['Inter'],
            'headline-xl-mobile': ['Inter'],
            'headline-sm': ['Inter'],
            'code-sm': ['JetBrains Mono'],
            'data-md': ['JetBrains Mono'],
            'data-lg': ['JetBrains Mono'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          },
          fontSize: {
            'label-sm': ['11px', { lineHeight: '16px', letterSpacing: '0.01em', fontWeight: '500' }],
            'label-md': ['12px', { lineHeight: '18px', fontWeight: '500' }],
            'label-lg': ['13px', { lineHeight: '20px', fontWeight: '500' }],
            'body-sm': ['13px', { lineHeight: '20px', fontWeight: '400' }],
            'body-md': ['14px', { lineHeight: '22px', fontWeight: '400' }],
            'body-lg': ['15px', { lineHeight: '24px', fontWeight: '400' }],
            'code-sm': ['12px', { lineHeight: '18px', fontWeight: '400' }],
            'headline-sm': ['15px', { lineHeight: '22px', letterSpacing: '-0.01em', fontWeight: '600' }],
            'headline-md': ['15px', { lineHeight: '22px', letterSpacing: '-0.01em', fontWeight: '600' }],
            'headline-lg': ['20px', { lineHeight: '28px', letterSpacing: '-0.015em', fontWeight: '600' }],
            'headline-xl': ['26px', { lineHeight: '34px', letterSpacing: '-0.02em', fontWeight: '600' }],
            'headline-xl-mobile': ['22px', { lineHeight: '30px', letterSpacing: '-0.015em', fontWeight: '600' }],
            'data-md': ['13px', { lineHeight: '18px', fontWeight: '500' }],
            'data-lg': ['15px', { lineHeight: '22px', fontWeight: '500' }],
          },
        },
      },
      safelist: [
        // Verdict colour classes are computed at runtime, so make sure the
        // Play CDN emits them regardless of DOM scan order.
        'text-v-corr','border-v-corr','bg-v-corr','decoration-v-corr',
        'text-v-contra','border-v-contra','bg-v-contra','decoration-v-contra',
        'text-v-recon','border-v-recon','bg-v-recon','decoration-v-recon',
        'text-v-super','border-v-super','bg-v-super','decoration-v-super',
        'text-v-partial','border-v-partial','bg-v-partial',
        'text-v-under','border-v-under','bg-v-under',
      ],
    };
  </script>

  <style>
    html, body { margin: 0; padding: 0; }
    html { background: #0b0c0f; color-scheme: dark; }
    body {
      overscroll-behavior: none;
      font-family: Inter, system-ui, sans-serif;
      background: #0b0c0f;
      color: #e7eaf0;
      min-height: 100vh;
    }
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
    }
    .tabular { font-variant-numeric: tabular-nums; }
    [hidden] { display: none !important; }

    /* A single soft wash at the top of the canvas instead of the old dot grid. */
    .grid-backdrop {
      background-color: #0b0c0f;
      background-image: radial-gradient(120% 60% at 50% 0%, #12151b 0%, #0b0c0f 60%);
      background-repeat: no-repeat;
    }

    /* A progress bar that is genuinely working but cannot report a number
       carries a moving stripe rather than a made-up percentage. */
    @keyframes fkl-stripe { from { background-position: 0 0; } to { background-position: 28px 0; } }
    .bar-working {
      background-image: linear-gradient(115deg,
        rgba(255, 255, 255, 0.22) 25%, transparent 25%, transparent 50%,
        rgba(255, 255, 255, 0.22) 50%, rgba(255, 255, 255, 0.22) 75%, transparent 75%);
      background-size: 28px 28px;
      animation: fkl-stripe 900ms linear infinite;
    }

    /* Thin, quiet scrollbars. */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #242a33; border: 3px solid #0b0c0f; border-radius: 8px;
    }
    ::-webkit-scrollbar-thumb:hover { background: #333a45; }
    ::selection { background: rgba(240, 180, 41, 0.28); color: #ffe3b5; }
  </style>

  <!-- React + htm loaded from esm.sh (no build step). -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom": "https://esm.sh/react-dom@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "htm": "https://esm.sh/htm@3.1.1"
      }
    }
  </script>
</head>
<body class="bg-background text-on-surface font-body-md">
  <div id="root"></div>
  <script type="module" src="/static/js/main.js"></script>
  <noscript>
    <p style="padding:2rem;text-align:center">
      This interface requires JavaScript. Same data at <code>/api/relations</code>.
    </p>
  </noscript>
</body>
</html>
